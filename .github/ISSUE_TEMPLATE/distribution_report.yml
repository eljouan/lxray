name: Distribution report
description: LXRAY works, or does not, on a distribution that is not in the compatibility matrix.
labels: ["compatibility"]
body:
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Oracle Linux 9.5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LXRAY version
      placeholder: lxray 1.2.0
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Installs and runs, report complete
        - Installs and runs, some sections empty
        - Does not install
        - Does not run
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Installation method, error messages, sections that stay empty.
